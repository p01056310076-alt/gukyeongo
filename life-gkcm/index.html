<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📒%3C/text%3E%3C/svg%3E">

<style>
:root{
  --paper:#F5F7F9; --sheet:#FFFFFF; --ink:#1F2A44; --sub:#5A6478; --line:#DDE2EA;
  --hosp:#2F7D6D; --gift:#B8434E; --car:#3B5BA5; --home:#A8741A; --renew:#6B4FA0; --store:#7A5A3A; --idea:#B03A78; --acct:#2E6F8E; --trip:#C2571A; --all:#1F2A44;
  --warn:#C0392B; --soon:#B7791F; --focus:#3B5BA5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141922; --sheet:#1D2430; --ink:#E8ECF3; --sub:#A3ADBF; --line:#323B4B;
    --hosp:#5DBBA6; --gift:#E07A84; --car:#7C9BE0; --home:#D9A649; --renew:#A68AD6; --store:#C9A57F; --idea:#E77FB3; --acct:#6FB3D2; --trip:#EE9559; --all:#E8ECF3;
    --warn:#F07167; --soon:#E0B04F; --focus:#7C9BE0;
  }
}
:root[data-theme="dark"]{
  --paper:#141922; --sheet:#1D2430; --ink:#E8ECF3; --sub:#A3ADBF; --line:#323B4B;
  --hosp:#5DBBA6; --gift:#E07A84; --car:#7C9BE0; --home:#D9A649; --renew:#A68AD6; --store:#C9A57F; --idea:#E77FB3; --acct:#6FB3D2; --trip:#EE9559; --all:#E8ECF3;
  --warn:#F07167; --soon:#E0B04F; --focus:#7C9BE0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
header{padding:22px 0 8px}
.brand{font-size:15px;color:var(--sub);margin:0}
h1{font-size:30px;margin:0;letter-spacing:-.5px;font-weight:700}
.lead{margin:4px 0 0;color:var(--sub);font-size:16px}

/* 바인더 색인 탭 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:12px 0 0;border-bottom:3px solid var(--tabc,var(--all));scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:var(--sheet);border-radius:12px 12px 0 0;padding:10px 14px 8px;font-size:17px;font-weight:500;color:var(--sub);border-top:5px solid var(--c);cursor:pointer;min-height:48px}
.tab[aria-selected="true"]{background:var(--c);color:#fff;font-weight:700}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#141922}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#141922}}

section{margin-top:22px}
h2{font-size:21px;margin:0 0 10px;font-weight:700}
.hint{color:var(--sub);font-size:15px;margin:-4px 0 10px}
.list{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.row:first-child{border-top:0}
.dot{flex:0 0 10px;height:10px;border-radius:50%;background:var(--c);margin-top:9px}
.rmain{flex:1;min-width:0}
.rtitle{font-weight:700;display:block}
.rmeta{color:var(--sub);font-size:15px;display:block}
.ramt{font-weight:700;white-space:nowrap}
.dday{font-weight:700;white-space:nowrap;font-size:16px;padding:2px 10px;border-radius:999px;border:2px solid currentColor}
.over{color:var(--warn)} .soon{color:var(--soon)} .later{color:var(--sub)}
.empty{background:var(--sheet);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--sub)}
.empty button{margin-top:10px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:48px;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:2px solid var(--warn)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:16px 24px;font-size:19px;font-weight:700;background:#C4596D;color:#fff;box-shadow:0 6px 18px rgba(20,25,34,.28);cursor:pointer}
#fsave,#coverGo{background:#C4596D;color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input[type=search]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--sheet);min-height:50px}

/* 경조사 저울 */
.scale{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px;border-top:1px solid var(--line)}
.scale:first-child{border-top:0}
.bar{grid-column:1/-1;display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%}
.bar .s{background:var(--gift)} .bar .r{background:var(--hosp)}
.legend{font-size:14px;color:var(--sub)}

/* 결산 */
.sum{padding:14px;border-top:1px solid var(--line)}
.sum:first-child{border-top:0}
.sumtop{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.meter{height:12px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.big{font-size:28px;font-weight:700;margin:0}

/* 진료 요약 */
.summary{background:var(--sheet);border:2px solid var(--hosp);border-radius:14px;padding:18px}
.summary h3{margin:0 0 4px;font-size:22px}
.srow{padding:12px 0;border-top:1px solid var(--line);font-size:20px}
.srow b{display:block}

/* 입력 시트 */
dialog{border:0;padding:0;width:min(640px,100%);max-height:92%;border-radius:18px 18px 0 0;margin:auto auto 0;background:var(--sheet);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.sheet{padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));border-top:6px solid var(--c)}
.sheet h2{margin-bottom:14px}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.catpick button{border:2px solid var(--c);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;color:var(--c);cursor:pointer;min-height:44px}
.catpick button[aria-pressed="true"]{background:var(--c);color:#fff}
label{display:block;font-weight:500;margin:12px 0 4px}
.f{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);min-height:50px}
textarea.f{min-height:84px;resize:vertical}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;min-height:50px}
.seg button[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.cyc{font-size:15px;color:var(--c);margin-top:4px}
.acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.status{font-size:14px;color:var(--sub);margin-top:6px}
.ta{width:100%;min-height:140px;font-size:13px;font-family:monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);background:transparent;color:var(--c);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:44px}
.warnbox{background:var(--sheet);border:2px solid var(--acct);border-left-width:8px;border-radius:12px;padding:14px 16px;font-size:16px}
.warnbox b{display:block;font-size:18px;margin-bottom:4px}
.subs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub{flex:0 0 auto;border:2px solid var(--c);background:transparent;color:var(--c);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:46px}
.sub[aria-pressed="true"]{background:var(--c);color:#fff}
.catgrp{margin:0 0 4px;font-size:14px;color:var(--sub);width:100%}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:10px 0 10px 44px;border-top:1px solid var(--line);font-size:18px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:10px;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.gate{position:fixed;inset:0;z-index:40;background:#6B2737;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.gate[hidden]{display:none}
.gatebox{width:min(360px,100%);text-align:center}
.gatebox h2{font-size:28px;margin:0 0 6px}
.gatebox p{margin:0 0 18px;opacity:.9}
.gatebox input{width:100%;font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border-radius:12px;border:0;min-height:60px;color:#1F2A44}
.gatebox .btn{width:100%;margin-top:12px;background:#C4596D;color:#fff;font-size:20px}
.gatebox .err{min-height:24px;margin-top:10px;color:#FFD6E0;font-weight:700}
.copy{text-align:center;font-size:13px;color:var(--sub);margin:40px 0 0}
.coverwrap .copy{margin-top:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 8px}
.pth{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line);border:0;padding:0;cursor:pointer}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth .prm{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,25,34,.75);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
#pdlg{max-height:100%;height:100%;width:100%;margin:0;border-radius:0;background:#111;padding:0}
#pdlg .pv{height:100%;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#pdlg .pv img{flex:1;min-height:0;width:100%;object-fit:contain}
#pdlg .pv .btn{margin-top:10px;background:#C4596D;color:#fff}
.aibox{border:2px dashed #C4596D;border-radius:14px;padding:12px;margin:0 0 14px;background:var(--paper)}
.aiok{border:2px solid #C4596D;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:15px}
.stat{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--line);white-space:nowrap}
/* 표지 */
.cover{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.cover[hidden]{display:none}
.book{position:relative;width:min(340px,82vw);aspect-ratio:3/4.2;max-height:78vh;background:#6B2737;border-radius:10px 18px 18px 10px;box-shadow:0 20px 40px rgba(10,14,20,.35), inset 14px 0 0 rgba(0,0,0,.22);color:#F5F7F9;display:flex;flex-direction:column;padding:28px 34px 24px 34px}
.rings{position:absolute;left:4px;top:12%;bottom:12%;display:flex;flex-direction:column;justify-content:space-between}
.rings i{display:block;width:16px;height:16px;border-radius:50%;background:#C9CFD8;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.idx{position:absolute;right:-26px;top:8%;display:flex;flex-direction:column;gap:5px}
.idx span{display:block;width:26px;padding:5px 0;border-radius:0 8px 8px 0;background:var(--c);color:#fff;font-size:12px;font-weight:700;writing-mode:vertical-rl;text-align:center;letter-spacing:1px}
.label{margin-top:auto;margin-bottom:auto;background:#F5F7F9;color:#6B2737;border-radius:6px;padding:18px 16px;text-align:center;box-shadow:0 0 0 3px #6B2737, 0 0 0 5px #C9CFD8}
.label small{display:block;font-size:14px;color:#5A6478}
.label strong{display:block;font-size:30px;letter-spacing:-1px;line-height:1.2;margin:4px 0}
.label em{font-style:normal;font-size:15px;color:#5A6478}
.bookfoot{display:flex;justify-content:space-between;font-size:14px;opacity:.85}
.covergo{margin-top:22px;width:min(340px,82vw)}
.covergo .btn{width:100%;font-size:20px;padding:16px}
.coverwrap{display:flex;flex-direction:column;align-items:center}
@media (prefers-reduced-motion: no-preference){.cover.out{animation:flip .45s ease-in forwards}@keyframes flip{to{opacity:0;transform:perspective(900px) rotateY(-70deg);transform-origin:left center}}}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media print{.tabs,.fab,header .lead,.tools,.noprint{display:none!important}body{background:#fff}}
</style>
