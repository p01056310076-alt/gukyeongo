<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>구경GO 생활템 진단소 | 30초 생활템 유형 진단</title>
<meta name="description" content="5가지 질문으로 알아보는 나의 생활템 유형! 30초 만에 딱 맞는 생활용품을 추천받아보세요.">
<style>
/* =========================================================
   구경GO 생활템 진단소 — style.css
   색상, 글꼴, 간격 등은 :root 변수에서 한 번에 관리합니다.
   색만 바꾸고 싶다면 아래 :root 안의 값만 수정하면 됩니다.
========================================================= */

:root {
  /* 색상 팔레트 */
  --color-bg: #FBF9F4;          /* 전체 배경 (따뜻한 아이보리) */
  --color-card: #FFFFFF;         /* 카드 배경 */
  --color-ink: #22291F;          /* 기본 글자색 (짙은 녹빛 잉크) */
  --color-ink-soft: #5C6459;     /* 보조 설명 글자색 */
  --color-primary: #2F6B4F;      /* 메인 포인트 (숲색 — 신뢰감) */
  --color-primary-dark: #234F3B;
  --color-accent: #FF7A59;       /* 강조 포인트 (산호색 — 활기) */
  --color-accent-soft: #FFE7DD;
  --color-line: #EAE4D6;         /* 테두리/구분선 */
  --color-chip: #F3F0E6;         /* 선택 안 된 옵션 배경 */
  --color-kakao: #FEE500;
  --color-kakao-ink: #391B1B;

  /* 타이포그래피 */
  --font-base: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR",
               -apple-system, BlinkMacSystemFont, Roboto, sans-serif;

  /* 레이아웃 */
  --radius-card: 28px;
  --radius-btn: 16px;
  --radius-chip: 14px;
  --max-width: 440px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: var(--font-base);
  -webkit-font-smoothing: antialiased;
  width: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: var(--max-width);
  min-height: 100vh;
  padding: 20px 16px 40px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

/* ---------- 브랜드 표시 ---------- */
.brand-mark {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-ink-soft);
  text-align: center;
  margin-bottom: 18px;
  letter-spacing: 0.2px;
}

/* ---------- 화면 전환 ---------- */
.screen {
  display: none;
  flex: 1;
}
.screen.is-active {
  display: flex;
  flex-direction: column;
}

/* ---------- 공통 카드 ---------- */
.card {
  background: var(--color-card);
  border-radius: var(--radius-card);
  padding: 32px 24px 28px;
  box-shadow: 0 10px 30px rgba(34, 41, 31, 0.06);
  border: 1px solid var(--color-line);
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ---------- 버튼 공통 ---------- */
.btn {
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: var(--radius-btn);
  padding: 16px 20px;
  cursor: pointer;
  width: 100%;
  text-align: center;
  transition: transform 0.08s ease, opacity 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.98); }

.btn-large { padding: 18px 20px; font-size: 17px; }

.btn-primary {
  background: var(--color-primary);
  color: #FFFFFF;
}
.btn-primary:hover { background: var(--color-primary-dark); }

.btn-secondary {
  background: var(--color-chip);
  color: var(--color-ink);
}

.btn-kakao {
  background: var(--color-kakao);
  color: var(--color-kakao-ink);
}

.btn-ghost {
  background: transparent;
  color: var(--color-ink-soft);
  font-weight: 600;
  padding: 12px;
}

/* ---------- 첫 화면 ---------- */
.home-card {
  text-align: center;
  justify-content: center;
  gap: 14px;
  padding-top: 48px;
  padding-bottom: 40px;
}

.eyebrow-emoji { font-size: 40px; margin: 0; }

.home-title {
  font-size: 24px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.3px;
}

.home-lead {
  font-size: 19px;
  font-weight: 600;
  line-height: 1.5;
  margin: 4px 0 6px;
  color: var(--color-primary-dark);
}

.home-desc {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--color-ink-soft);
  margin: 0 0 20px;
}

/* ---------- 질문 화면 ---------- */
.progress-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
}

.progress-dots {
  display: flex;
  gap: 8px;
}
.progress-dots span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--color-line);
  display: inline-block;
}
.progress-dots span.is-done {
  background: var(--color-primary);
}

.progress-text {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--color-ink-soft);
  margin: 0;
}

.quiz-question {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.4;
  margin: 0 0 20px;
  text-align: center;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.option-btn {
  font-family: inherit;
  width: 100%;
  text-align: left;
  font-size: 16px;
  font-weight: 600;
  color: var(--color-ink);
  background: var(--color-chip);
  border: 2px solid transparent;
  border-radius: var(--radius-chip);
  padding: 16px 18px;
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s ease;
  -webkit-tap-highlight-color: transparent;
}
.option-btn:hover { border-color: var(--color-primary); }
.option-btn:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}
.option-btn.is-selected {
  background: var(--color-accent-soft);
  border-color: var(--color-accent);
}

#btn-prev {
  margin-top: auto;
  align-self: center;
}
#btn-prev[hidden] { display: none; }

/* ---------- 결과 화면 ---------- */
.result-card { gap: 4px; }

.result-kicker {
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--color-accent);
  margin: 0 0 6px;
}

.result-title {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  margin: 0 0 14px;
  line-height: 1.4;
}

.result-desc {
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--color-ink-soft);
  text-align: center;
  margin: 0 0 26px;
  white-space: pre-line;
}

.products-block { margin-bottom: 8px; }

.products-title {
  font-size: 16px;
  font-weight: 800;
  margin: 0 0 14px;
  text-align: center;
}

.product-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.product-card {
  display: flex;
  gap: 12px;
  align-items: center;
  background: var(--color-chip);
  border-radius: var(--radius-chip);
  padding: 12px;
}

.product-rank {
  font-size: 12px;
  font-weight: 800;
  color: var(--color-primary);
  min-width: 22px;
}

.product-thumb {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  background: var(--color-accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
  overflow: hidden;
}
.product-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.product-info { flex: 1; min-width: 0; }

.product-name {
  font-size: 14.5px;
  font-weight: 700;
  margin: 0 0 3px;
}

.product-desc {
  font-size: 12.5px;
  color: var(--color-ink-soft);
  margin: 0 0 4px;
  line-height: 1.4;
}

.product-reason {
  font-size: 11.5px;
  color: var(--color-primary-dark);
  margin: 0 0 8px;
  font-weight: 600;
}

.product-link-btn {
  display: inline-block;
  font-size: 12.5px;
  font-weight: 700;
  color: #FFFFFF;
  background: var(--color-primary);
  border-radius: 10px;
  padding: 7px 12px;
  text-decoration: none;
}

.share-invite {
  text-align: center;
  font-size: 14px;
  color: var(--color-ink-soft);
  margin: 4px 0 16px;
}

.share-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.copy-toast {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--color-primary);
  min-height: 18px;
  margin: 10px 0 0;
}

/* ---------- 작은 화면 대응 ---------- */
@media (max-width: 360px) {
  .home-title { font-size: 21px; }
  .quiz-question { font-size: 18px; }
}

/* ---------- 키보드 접근성 ---------- */
button:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

</style>
</head>
<body>

<div class="app">

  <!-- 공통 상단 브랜드 표시 -->
  <header class="brand-mark">🛍️ 구경GO</header>

  <!-- ============ 1. 첫 화면 ============ -->
  <section id="screen-home" class="screen is-active">
    <div class="card home-card">
      <p class="eyebrow-emoji">🛍️</p>
      <h1 class="home-title">구경GO 생활템 진단소</h1>
      <p class="home-lead">내게 필요한 생활템,<br><strong>30초 만에</strong> 찾아보세요!</p>
      <p class="home-desc">
        물건은 많은데 정작 나에게 필요한 생활용품이 뭔지 모르겠다면?<br><br>
        5가지 질문에 답하면 지금 당신에게 잘 맞는<br>생활템 유형을 찾아드립니다.
      </p>
      <button type="button" class="btn btn-primary btn-large" id="btn-start">
        🔍 30초 진단 시작하기
      </button>
    </div>
  </section>

  <!-- ============ 2. 질문 화면 (Q1~Q5 공통 템플릿) ============ -->
  <section id="screen-quiz" class="screen">
    <div class="card quiz-card">

      <div class="progress-wrap">
        <div class="progress-dots" id="progress-dots" aria-hidden="true"></div>
        <p class="progress-text" id="progress-text">1 / 5</p>
      </div>

      <h2 class="quiz-question" id="quiz-question">질문</h2>

      <div class="options" id="quiz-options" role="group" aria-labelledby="quiz-question">
        <!-- 옵션 버튼은 JS로 렌더링 -->
      </div>

      <button type="button" class="btn btn-ghost" id="btn-prev">← 이전</button>
    </div>
  </section>

  <!-- ============ 3. 결과 화면 ============ -->
  <section id="screen-result" class="screen">
    <div class="card result-card">
      <p class="result-kicker">🎉 진단 완료!</p>
      <h2 class="result-title" id="result-title">당신은 「깔끔정리형」입니다!</h2>
      <p class="result-desc" id="result-desc">설명 텍스트</p>

      <div class="products-block">
        <h3 class="products-title">🛍️ 구경GO 추천 생활템</h3>
        <div class="product-list" id="product-list">
          <!-- 상품 카드 3개는 JS로 렌더링 -->
        </div>
      </div>

      <p class="share-invite">내 결과가 재미있었다면 친구에게도 한번 보내보세요 😊</p>

      <div class="share-actions">
        <button type="button" class="btn btn-primary btn-large" id="btn-share">📤 친구에게 공유하기</button>
        <button type="button" class="btn btn-kakao btn-large" id="btn-kakao">💬 카카오톡으로 공유</button>
        <button type="button" class="btn btn-secondary" id="btn-copy">🔗 링크 복사</button>
        <button type="button" class="btn btn-ghost" id="btn-restart">🔄 다시 진단하기</button>
      </div>

      <p class="copy-toast" id="copy-toast" aria-live="polite"></p>
    </div>
  </section>

</div>

<!-- 카카오 SDK: 실제 서비스 오픈 전, 아래 스크립트 주석을 풀고 자바스크립트 키를 입력하세요 -->
<!--
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
  integrity="sha384-TiCUE00h649xVoJcQfSyKt8H6C0/mMSaz7fkfM3o5CO6ZM5gW0e1RIsF+t7YFHIL" crossorigin="anonymous"></script>
-->

<script>
/* =========================================================
   구경GO 생활템 진단소 — script.js
   이 파일 안에서 아래 4가지를 자유롭게 수정할 수 있어요.
   1) QUESTIONS      : 질문/선택지 내용
   2) TYPE_SCORE_MAP  : 선택지를 고르면 어떤 유형 점수가 오르는지
   3) RESULT_TYPES    : 결과 화면에 나오는 유형 설명
   4) PRODUCTS        : 추천 상품 정보 (이름/설명/이미지/쿠팡링크)
   개인정보(이름, 전화번호 등)는 전혀 수집하지 않으며,
   모든 계산은 이 브라우저 안에서만 이루어집니다.
========================================================= */

/* ---------------------------------------------------------
   1) 질문 데이터
   - id: 질문 번호 (수정하지 마세요, 내부 로직에서 사용)
   - question: 화면에 보이는 질문 문구 → 자유롭게 수정 가능
   - options: 선택지 목록. text만 바꾸면 문구가 바뀌고,
     scores는 "이 선택지를 고르면 어떤 유형 점수가 몇 점 오르는지"입니다.
--------------------------------------------------------- */
const QUESTIONS = [
  {
    id: "q1",
    question: "Q1. 요즘 가장 불편한 곳은 어디인가요?",
    options: [
      { text: "🏠 집",       scores: { storage: 3 } },
      { text: "🍳 주방",     scores: { kitchen: 5 } },
      { text: "🚗 자동차",   scores: { vehicle: 4 } },
      { text: "🚿 욕실",     scores: { convenience: 3 } },
      { text: "📦 수납공간", scores: { storage: 4 } },
    ],
  },
  {
    id: "q2",
    question: "Q2. 가장 해결하고 싶은 문제는 무엇인가요?",
    options: [
      { text: "정리가 안 된다",              scores: { storage: 3 } },
      { text: "청소가 귀찮다",               scores: { kitchen: 2, convenience: 1 } },
      { text: "냄새가 신경 쓰인다",          scores: { kitchen: 3 } },
      { text: "공간이 부족하다",             scores: { storage: 3 } },
      { text: "생활을 좀 더 편하게 만들고 싶다", scores: { convenience: 3 } },
    ],
  },
  {
    id: "q3",
    question: "Q3. 제품을 고를 때 가장 중요한 것은?",
    options: [
      { text: "💰 가격",   scores: { value: 3 } },
      { text: "👍 편리함", scores: { convenience: 3 } },
      { text: "🎨 디자인", scores: { idea: 2, share: 1 } },
      { text: "💪 내구성", scores: { vehicle: 2, storage: 1 } },
      { text: "🛠️ 활용도", scores: { idea: 3 } },
    ],
  },
  {
    id: "q4",
    question: "Q4. 보통 얼마 정도의 제품을 찾으시나요?",
    options: [
      { text: "1만원 이하",             scores: { value: 3 } },
      { text: "1~3만원",                scores: { value: 2 } },
      { text: "3~5만원",                scores: { vehicle: 1, idea: 1 } },
      { text: "가격보다 좋은 제품이 중요하다", scores: { idea: 2, share: 1 } },
    ],
  },
  {
    id: "q5",
    question: "Q5. 어떤 제품을 발견했을 때 가장 끌리나요?",
    options: [
      { text: "꼭 필요한 실용템",             scores: { convenience: 2 } },
      { text: "있으면 생활이 편해지는 제품",  scores: { convenience: 3 } },
      { text: "가격 대비 좋은 제품",          scores: { value: 3 } },
      { text: "신기하고 아이디어가 좋은 제품", scores: { idea: 3 } },
      { text: "다른 사람에게 알려주고 싶은 제품", scores: { share: 3 } },
    ],
  },
];

/* ---------------------------------------------------------
   2) 결과 유형 설명
   - key는 QUESTIONS의 scores에 쓰인 이름과 반드시 같아야 합니다.
   - title, emoji, desc만 바꾸면 결과 문구를 자유롭게 수정할 수 있습니다.
--------------------------------------------------------- */
const RESULT_TYPES = {
  storage: {
    emoji: "🧹",
    name: "깔끔정리형",
    desc: "눈에 보이는 물건이 깔끔하게 정리되어 있어야\n마음이 편한 타입!\n\n수납과 정리 아이템을 먼저 챙겨보면\n생활이 한결 가벼워질 거예요.",
    productIds: ["home1", "home2", "home3"],
  },
  convenience: {
    emoji: "✨",
    name: "생활편의형",
    desc: "조금이라도 생활이 편해진다면\n새로운 아이템을 찾아보는 타입!\n\n작은 변화가 매일의 편안함을 만들어줍니다.",
    productIds: ["home2", "kitchen1", "kitchen2"],
  },
  value: {
    emoji: "💰",
    name: "가성비형",
    desc: "비싸다고 무조건 좋은 건 아니죠.\n가격과 활용도를 함께 보는 타입!\n\n합리적인 소비로 알뜰하게 생활을 채워보세요.",
    productIds: ["home1", "kitchen2", "home3"],
  },
  vehicle: {
    emoji: "🚗",
    name: "차량관리형",
    desc: "집뿐 아니라 자동차도\n깔끔하게 관리하는 타입!\n\n자주 쓰는 물건을 찾기 어렵다면\n차량용 정리템으로 스트레스를 줄여보세요.",
    productIds: ["car1", "car2", "car3"],
  },
  kitchen: {
    emoji: "🍳",
    name: "주방실용형",
    desc: "주방에서 불필요한 시간과 수고를\n줄여주는 제품을 좋아하는 타입!\n\n조리와 정리를 동시에 편하게 만들어줄 아이템을 모아봤어요.",
    productIds: ["kitchen1", "kitchen2", "kitchen3"],
  },
  idea: {
    emoji: "🧠",
    name: "아이디어템 탐험형",
    desc: "이런 것도 있어? 신기한 제품을\n발견하는 재미가 있는 타입!\n\n남들보다 한발 빠르게 아이디어 상품을 만나보세요.",
    productIds: ["home2", "kitchen3", "car3"],
  },
  share: {

/* =========================================================
   여기서부터는 앱이 동작하는 코드입니다.
   기능을 바꾸는 게 목적이 아니라면 아래는 그대로 두세요.
========================================================= */

const state = {
  currentStep: 0,          // 0 = 첫 화면 진행 전, 1~5 = 질문 번호
  answers: [],              // 사용자가 고른 옵션 index 저장 (뒤로가기용)
  resultTypeKey: null,
};

const screens = {
  home: document.getElementById("screen-home"),
  quiz: document.getElementById("screen-quiz"),
  result: document.getElementById("screen-result"),
};

function showScreen(name) {
  Object.values(screens).forEach((el) => el.classList.remove("is-active"));
  screens[name].classList.add("is-active");
  window.scrollTo(0, 0);
}

/* ---------- 진행률(●○○○○) 렌더링 ---------- */
function renderProgress(stepIndex) {
  const dotsWrap = document.getElementById("progress-dots");
  dotsWrap.innerHTML = "";
  for (let i = 0; i < QUESTIONS.length; i++) {
    const dot = document.createElement("span");
    if (i <= stepIndex) dot.classList.add("is-done");
    dotsWrap.appendChild(dot);
  }
  document.getElementById("progress-text").textContent =
    `${stepIndex + 1} / ${QUESTIONS.length}`;
}

/* ---------- 질문 화면 렌더링 ---------- */
function renderQuestion(stepIndex) {
  const q = QUESTIONS[stepIndex];
  renderProgress(stepIndex);

  document.getElementById("quiz-question").textContent = q.question;

  const optionsWrap = document.getElementById("quiz-options");
  optionsWrap.innerHTML = "";

  q.options.forEach((opt, optIndex) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn";
    btn.textContent = opt.text;

    // 이전에 이 질문에서 골랐던 답이 있으면 선택 표시 유지
    if (state.answers[stepIndex] === optIndex) {
      btn.classList.add("is-selected");
    }

    btn.addEventListener("click", () => selectOption(stepIndex, optIndex));
    optionsWrap.appendChild(btn);
  });

  // 이전 버튼: 첫 질문에서는 숨김
  const prevBtn = document.getElementById("btn-prev");
  prevBtn.hidden = stepIndex === 0;
}

/* ---------- 옵션 선택 처리 ---------- */
function selectOption(stepIndex, optIndex) {
  state.answers[stepIndex] = optIndex;

  if (stepIndex < QUESTIONS.length - 1) {
    state.currentStep = stepIndex + 1;
    renderQuestion(state.currentStep);
  } else {
    // 마지막 질문까지 답했다면 결과 계산
    calculateAndShowResult();
  }
}

/* ---------- 이전 버튼 ---------- */
document.getElementById("btn-prev").addEventListener("click", () => {
  if (state.currentStep > 0) {
    state.currentStep -= 1;
    renderQuestion(state.currentStep);
  }
});

/* ---------------------------------------------------------
   4) 점수 계산 함수 (여기만 봐도 로직을 알 수 있도록 분리했습니다)
   - answers: [0,2,1,3,4] 처럼 각 질문에서 고른 옵션 번호 배열
   - 반환값: 가장 점수가 높은 유형의 key (예: "vehicle")
--------------------------------------------------------- */
function calculateResultType(answers) {
  const scores = {};
  Object.keys(RESULT_TYPES).forEach((key) => (scores[key] = 0));

  answers.forEach((optIndex, qIndex) => {
    const chosenOption = QUESTIONS[qIndex].options[optIndex];
    if (!chosenOption) return;
    Object.entries(chosenOption.scores).forEach(([typeKey, point]) => {
      scores[typeKey] = (scores[typeKey] || 0) + point;
    });
  });

  // 가장 높은 점수 찾기
  let topScore = -1;
  let topTypes = [];
  Object.entries(scores).forEach(([typeKey, score]) => {
    if (score > topScore) {
      topScore = score;
      topTypes = [typeKey];
    } else if (score === topScore) {
      topTypes.push(typeKey);
    }
  });

  // 동점이면 Q1, Q2 답변의 유형을 우선한다
  if (topTypes.length > 1) {
    const priorityTypes = [];
    [0, 1].forEach((qIndex) => {
      const optIndex = answers[qIndex];
      const opt = QUESTIONS[qIndex] && QUESTIONS[qIndex].options[optIndex];
      if (opt) priorityTypes.push(...Object.keys(opt.scores));
    });
    const preferred = topTypes.find((t) => priorityTypes.includes(t));
    if (preferred) return preferred;
  }

  return topTypes[0];
}

/* ---------- 결과 화면 렌더링 ---------- */
function calculateAndShowResult() {
  const typeKey = calculateResultType(state.answers);
  state.resultTypeKey = typeKey;
  const result = RESULT_TYPES[typeKey];

  document.getElementById("result-title").textContent =
    `${result.emoji} 당신은 「${result.name}」입니다!`;
  document.getElementById("result-desc").textContent = result.desc;

  const listWrap = document.getElementById("product-list");
  listWrap.innerHTML = "";

  result.productIds.forEach((productId, idx) => {
    const p = PRODUCTS[productId];
    if (!p) return;

    const card = document.createElement("div");
    card.className = "product-card";
    card.innerHTML = `
      <span class="product-rank">${idx + 1}위</span>
      <span class="product-thumb">
        ${p.image ? `<img src="${p.image}" alt="${p.name}">` : p.name.slice(0, 2)}
      </span>
      <div class="product-info">
        <p class="product-name">${p.name}</p>
        <p class="product-desc">${p.desc}</p>
        <p class="product-reason">💡 ${p.reason}</p>
        <a class="product-link-btn" href="${p.url}" target="_blank" rel="noopener sponsored"
           data-product-id="${productId}">상품 자세히 보기</a>
      </div>
    `;
    listWrap.appendChild(card);
  });

  // (2차 버전용) 상품 클릭 통계를 붙이고 싶다면 아래 리스너 안에 코드를 추가하세요.
  listWrap.querySelectorAll(".product-link-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      // 예: trackEvent('product_click', { productId: btn.dataset.productId, type: typeKey });
    });
  });

  showScreen("result");
}

/* ---------------------------------------------------------
   공유 기능
--------------------------------------------------------- */
function getShareText() {
  const result = RESULT_TYPES[state.resultTypeKey];
  const typeName = result ? result.name : "생활템";
  return `나는 구경GO 생활템 진단에서 ${typeName}이 나왔어요 😂\n당신은 어떤 유형인지 30초만에 확인해보세요!`;
}

function showToast(message) {
  const toast = document.getElementById("copy-toast");
  toast.textContent = message;
  setTimeout(() => {
    if (toast.textContent === message) toast.textContent = "";
  }, 2500);
}

async function copyLinkToClipboard() {
  const shareText = `${getShareText()}\n${window.location.href}`;
  try {
    await navigator.clipboard.writeText(shareText);
    showToast("링크가 복사되었어요! 원하는 곳에 붙여넣어 보세요 📋");
  } catch (err) {
    // 클립보드 API를 지원하지 않는 브라우저를 위한 대체 방법
    const textarea = document.createElement("textarea");
    textarea.value = shareText;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand("copy");
      showToast("링크가 복사되었어요! 원하는 곳에 붙여넣어 보세요 📋");
    } catch (e) {
      showToast("복사에 실패했어요. 화면을 길게 눌러 직접 복사해주세요.");
    }
    document.body.removeChild(textarea);
  }
}

document.getElementById("btn-share").addEventListener("click", async () => {
  const shareData = {
    title: "구경GO 생활템 진단소",
    text: getShareText(),
    url: window.location.href,
  };

  if (navigator.share) {
    try {
      await navigator.share(shareData);
    } catch (err) {
      // 사용자가 공유를 취소한 경우 등은 조용히 무시합니다.
    }
  } else {
    // Web Share API 미지원 브라우저 → 링크 복사로 대체
    copyLinkToClipboard();
  }
});

document.getElementById("btn-copy").addEventListener("click", copyLinkToClipboard);

/* ---------------------------------------------------------
   카카오톡 공유 (선택 사항)
   -----------------------------------------------------------
   ⚠️ 실제로 작동하려면 아래 두 가지가 필요합니다.
   1) index.html 하단의 카카오 SDK <script> 주석을 해제
   2) 아래 "여기에 카카오 JavaScript 키 입력" 부분에
      카카오 개발자센터에서 발급받은 JavaScript 키를 입력

   카카오 SDK가 없어도 이 버튼은 "카카오톡 공유 준비 중" 안내와 함께
   자동으로 링크 복사로 대체되므로, 앱 자체는 항상 정상 작동합니다.
--------------------------------------------------------- */
function initKakao() {
  if (typeof Kakao === "undefined") return;
  if (Kakao.isInitialized && Kakao.isInitialized()) return;
  Kakao.init("여기에 카카오 JavaScript 키 입력");
}

document.getElementById("btn-kakao").addEventListener("click", () => {
  if (typeof Kakao === "undefined") {
    showToast("카카오톡 공유는 준비 중이에요. 대신 링크를 복사할게요 🔗");
    copyLinkToClipboard();
    return;
  }

  initKakao();

  try {
    Kakao.Share.sendDefault({
      objectType: "feed",
      content: {
        title: "구경GO 생활템 진단소",
        description: getShareText(),
        imageUrl: "", // 대표 이미지 URL을 넣으면 카카오톡 미리보기에 표시됩니다.
        link: {
          mobileWebUrl: window.location.href,
          webUrl: window.location.href,
        },
      },
      buttons: [
        {
          title: "나도 진단하기",
          link: {
            mobileWebUrl: window.location.href,
            webUrl: window.location.href,
          },
        },
      ],
    });
  } catch (err) {
    showToast("카카오톡 공유 중 문제가 발생했어요. 링크 복사로 대신할게요 🔗");
    copyLinkToClipboard();
  }
});
